<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>İbrahim & Sümeyye – Özel Anılar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #ffe6f2;
        color: #444;
    }

    header {
        text-align: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #ffb6d9, #ffd9ea);
        color: #fff;
        position: relative;
        overflow: hidden;
    }

    header h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    /* Parçacık animasyonu */
    .confetti {
        position: fixed;
        top: -10px;
        width: 10px;
        height: 10px;
        background: #ff84c2;
        opacity: 0.8;
        border-radius: 50%;
        animation: fall 3s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-20px) rotate(0); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }

    .section {
        background: #fff;
        margin: 20px auto;
        width: min(900px, 95%);
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .photo-box {
        width: 100%;
        height: 270px;
        border-radius: 14px;
        background: #ffd9ea;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b46378;
        font-size: 18px;
        margin-bottom: 15px;
        position: relative;
        overflow: hidden;
    }

    .photo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 14px;
    }

    .upload-btn {
        margin-top: 10px;
        background: #ff9bcf;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        color: #fff;
        font-weight: bold;
    }

    .upload-btn:hover {
        background: #ff7fbe;
    }

    .year-message {
        text-align: center;
        padding: 20px;
        background: #fff4fc;
        border: 1px dashed #ff94c2;
        border-radius: 12px;
        margin-top: 20px;
    }

    .hidden { display: none; }

    #countdown {
        font-size: 24px;
        font-weight: bold;
        color: #d14e7b;
        margin-top: 15px;
    }

    iframe.spotify {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
    }
</style>
</head>

<body>

<!-- Otomatik şarkı -->
<button id="playMusic" class="upload-btn" style="margin:20px auto;display:block;width:200px;">🎵 Şarkıyı Oynat</button>
<iframe id="ytPlayer" class="spotify" src="https://www.youtube.com/embed/PY-jid_6RT0?enablejsapi=1" allow="autoplay"></iframe>

<header>
    <h1>💗 İbrahim & Sümeyye 💗</h1>
    <p>Sevgi defterinizin dijital hali</p>
</header>

<div class="section">
    <h2>📸 En Sevdiğim Fotoğraf</h2>
    <div class="photo-box" id="mainPhoto"><img src="https://drive.google.com/uc?id=11tXmRJvtx2FxSevyQXuDKftfcSVSggqw" /></div>
    

    <textarea style="width:100%;height:120px;border-radius:12px;padding:12px;border:1px solid #ffb6d9;">
Buraya fotoğrafın altına özel not / şiir / anı yazılabilir...
    </textarea>
</div>
